name: Learning quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  automated-tests:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -t . -v

  learning-quality-gate:
    name: Learning quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m maimemo_learning_rebuild.public_quality_gate --artifact-dir maimemo_learning_rebuild/artifacts

  final-user-authorization:
    name: Final user authorization
    needs: [automated-tests, learning-quality-gate]
    environment: maimemo-final-release
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release explicitly authorized by the repository owner."
