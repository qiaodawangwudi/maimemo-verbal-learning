name: Learning quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  automated-tests:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run repository-portable tests
        run: >-
          python -m unittest -v
          tests.maimemo_learning_rebuild.test_groups
          tests.maimemo_learning_rebuild.test_guard
          tests.maimemo_learning_rebuild.test_application_quality_gate
          tests.maimemo_learning_rebuild.test_markji
          tests.maimemo_learning_rebuild.test_models
          tests.maimemo_learning_rebuild.test_public_quality_gate
          tests.maimemo_learning_rebuild.test_readback
          tests.maimemo_learning_rebuild.test_render
          tests.maimemo_learning_rebuild.test_sources
          tests.maimemo_learning_rebuild.test_sync

  learning-quality-gate:
    name: Learning quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m maimemo_learning_rebuild.public_quality_gate --artifact-dir maimemo_learning_rebuild/artifacts

  application-card-quality-gate:
    name: Application card quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Require complete application review and useful scenario cards
        run: python -m maimemo_learning_rebuild.application_quality_gate --artifact-dir maimemo_learning_rebuild/artifacts

  final-user-authorization:
    name: Final user authorization
    needs: [automated-tests, learning-quality-gate, application-card-quality-gate]
    environment: maimemo-final-release
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release explicitly authorized by the repository owner."
