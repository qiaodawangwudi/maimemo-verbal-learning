name: Protected empty Maimemo target check

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/maimemo-empty-target-check.yml

permissions:
  contents: read

jobs:
  verify-empty-target:
    name: Verify the three target chapters are still empty
    environment: maimemo-final-release
    runs-on: ubuntu-latest
    steps:
      - name: Read and verify target metadata without disclosing identifiers
        shell: bash
        env:
          MAIMEMO_API_TOKEN: ${{ secrets.MAIMEMO_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          BASE_URL = "https://open.maimemo.com"
          EXPECTED_DECK_NAME = "公考成语积累辨析"
          EXPECTED_CHAPTER_NAMES = {"基本词义", "近义辨析", "场景应用"}
          ROUTE_BINDING_HASH = "4b61b114f86f934d88bfa83c0c9992141752dbef549a0e467f67a8af64a25c6c"


          class ProbeFailure(RuntimeError):
              def __init__(self, code):
                  super().__init__(code)
                  self.code = code


          def fetch(path, token):
              request = urllib.request.Request(
                  BASE_URL + path,
                  headers={
                      "Accept": "application/json",
                      "Authorization": "Bearer " + token,
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = json.loads(response.read().decode("utf-8-sig"))
              except Exception:
                  raise ProbeFailure("API_READ_FAILED") from None
              if not isinstance(payload, dict) or payload.get("errors"):
                  raise ProbeFailure("API_RESPONSE_CHANGED")
              data = payload.get("data", payload)
              if not isinstance(data, dict):
                  raise ProbeFailure("API_RESPONSE_CHANGED")
              return data


          try:
              token = os.environ["MAIMEMO_API_TOKEN"]
              if not token:
                  raise ProbeFailure("TOKEN_MISSING")
              deck_data = fetch(
                  "/open/api/v1/markji/decks?offset=0&limit=100", token
              )
              decks = deck_data.get("decks")
              if not isinstance(decks, list):
                  raise ProbeFailure("API_RESPONSE_CHANGED")
              matches = [
                  deck
                  for deck in decks
                  if isinstance(deck, dict)
                  and deck.get("name") == EXPECTED_DECK_NAME
              ]
              if len(matches) != 1 or not isinstance(matches[0].get("id"), str):
                  raise ProbeFailure("DECK_NOT_UNIQUE")
              deck_id = matches[0]["id"]
              chapter_data = fetch(
                  "/open/api/v1/markji/decks/"
                  + urllib.parse.quote(deck_id, safe="")
                  + "/chapters?with_cards=true",
                  token,
              )
              chapters = chapter_data.get("chapters")
              all_cards = chapter_data.get("cards", [])
              if not isinstance(chapters, list) or not isinstance(all_cards, list):
                  raise ProbeFailure("API_RESPONSE_CHANGED")
              target_chapters = [
                  chapter
                  for chapter in chapters
                  if isinstance(chapter, dict)
                  and chapter.get("name") in EXPECTED_CHAPTER_NAMES
              ]
              if len(target_chapters) != 3 or {
                  chapter.get("name") for chapter in target_chapters
              } != EXPECTED_CHAPTER_NAMES:
                  raise ProbeFailure("CHAPTERS_CHANGED")
              if any(
                  not isinstance(chapter.get("id"), str)
                  or not isinstance(chapter.get("card_ids"), list)
                  for chapter in target_chapters
              ):
                  raise ProbeFailure("API_RESPONSE_CHANGED")
              if any(chapter.get("card_ids") for chapter in target_chapters):
                  raise ProbeFailure("TARGET_NOT_EMPTY")
              target_ids = {chapter["id"] for chapter in target_chapters}
              cards = [
                  card
                  for card in all_cards
                  if isinstance(card, dict)
                  and card.get("chapter_id") in target_ids
              ]
              if not len(cards) == 0:
                  raise ProbeFailure("TARGET_NOT_EMPTY")
              binding = {
                  "deck_id": deck_id,
                  "routes": {
                      chapter["name"]: chapter["id"]
                      for chapter in target_chapters
                  },
              }
              canonical = json.dumps(
                  binding,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              if hashlib.sha256(canonical).hexdigest() != ROUTE_BINDING_HASH:
                  raise ProbeFailure("ROUTE_BINDING_CHANGED")
          except ProbeFailure as error:
              raise SystemExit(
                  "protected empty-target check failed: " + error.code
              ) from None
          except Exception:
              error = ProbeFailure("INTERNAL_ERROR")
              raise SystemExit(
                  "protected empty-target check failed: " + error.code
              ) from None
          finally:
              token = ""

          print("protected empty-target check passed")
          PY
